name: checks

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "30 18 * * *"

jobs:
  check:
    name: typecheck + online case validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check
        run: npm run check

  online:
    name: live online suite
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install chromium
        run: npx playwright install --with-deps chromium
      - name: Smoke live sites
        env:
          AMBERFLOW_DECISION_BASE_URL: ${{ secrets.AMBERFLOW_DECISION_BASE_URL }}
          AMBERFLOW_DECISION_MODEL: ${{ secrets.AMBERFLOW_DECISION_MODEL }}
          AMBERFLOW_DECISION_API_KEY: ${{ secrets.AMBERFLOW_DECISION_API_KEY }}
        run: npm run online -- --tier smoke --require-all
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: online-runs
          path: ~/.amberflow/online-runs
          if-no-files-found: ignore
