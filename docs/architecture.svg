<rect x="40" y="70" width="1480" height="236" class="band"/>
<text x="58" y="94" class="lay">① 入口层（一条命令 / 一次工具调用）</text>
<rect x="175" y="106" width="210" height="78" class="bx"/>
<text x="186" y="125" class="t" font-size="12.5">npm start · doctor</text>
<text x="186" y="141" class="s">src/start.ts</text>
<text x="186" y="155" class="s">开箱任务；演示一次即归纳信号</text>
<text x="186" y="169" class="s">缺件点名 + 一条补齐命令</text>
<rect x="400" y="106" width="210" height="78" class="bx"/>
<text x="411" y="125" class="t" font-size="12.5">npm run apps</text>
<text x="411" y="141" class="s">src/app-runner.ts</text>
<text x="411" y="155" class="s">数据腿 → 旅程 → 结束态不变量</text>
<text x="411" y="169" class="s">--dry / --no-model / --slot</text>
<rect x="625" y="106" width="210" height="78" class="bx"/>
<text x="636" y="125" class="t" font-size="12.5">npm run learn · agent</text>
<text x="636" y="141" class="s">tools/learn.ts --json --yes</text>
<text x="636" y="155" class="s">演示一次 → 录成应用包</text>
<text x="636" y="169" class="s">零模型重放通过才落盘</text>
<rect x="850" y="106" width="225" height="78" class="bx"/>
<text x="861" y="125" class="t" font-size="12.5">plan:flow · semantic</text>
<text x="861" y="141" class="s">plan-flow / semantic-flow</text>
<text x="861" y="155" class="s">一句话+种子页 → 模板+站点档案</text>
<text x="861" y="169" class="s">跨站迁移 · 回填重放门</text>
<rect x="1090" y="106" width="175" height="78" class="bx"/>
<text x="1101" y="125" class="t" font-size="12.5">plan-cli · datasource</text>
<text x="1101" y="141" class="s">plan_cli / datasource</text>
<text x="1101" y="155" class="s">手写计划；站点=配置</text>
<text x="1101" y="169" class="s">sources/*.json 发现制</text>
<rect x="1280" y="106" width="135" height="78" class="bx"/>
<text x="1291" y="125" class="t" font-size="12.5">bench · 探针</text>
<text x="1291" y="141" class="s">bench.ts / live-*</text>
<text x="1291" y="155" class="s">冻结计划跑分矩阵</text>
<text x="1291" y="169" class="s">可达性长流程实测</text>
<rect x="175" y="196" width="620" height="84" class="bxp"/>
<text x="186" y="215" class="t" font-size="12.5">DSH 插件模式（integrations/dsh-bridge）</text>
<text x="186" y="231" class="s">四个工具：apps 列包 · run 跑应用 · learn 录流程 · plan 出模板</text>
<text x="186" y="245" class="sm">引擎对 DSH 零引用：桥起 CLI 子进程，读 *-result.json 归纳 summary</text>
<text x="186" y="259" class="sm">summary 带 model: on|off(missing) 与决策来源小计；危险步默认拒绝</text>
<rect x="810" y="196" width="250" height="84" class="bxm"/>
<text x="821" y="215" class="t" font-size="12.5">npm run model:fetch</text>
<text x="821" y="231" class="s">src/model-fetch.ts → 装进 ⑤ 的约定路径</text>
<text x="821" y="245" class="s">图 + 权重（+ tokenizer）</text>
<text x="821" y="259" class="s">.part 先落，SHA256 先验后换</text>
<text x="821" y="273" class="s">半途态整组撤回，不覆盖已有</text>
<rect x="1075" y="196" width="340" height="98" class="bxe"/>
<text x="1086" y="215" class="t" font-size="12.5">度量与门禁（同一条命令可复现）</text>
<text x="1086" y="231" class="s">apps:matrix 声明成本 / 0 代码行 / 站点知识泄漏与债</text>
<text x="1086" y="245" class="s">apps:suite 逐应用真跑 + 模型账 · apps:gen --check</text>
<text x="1086" y="259" class="s">model:contribution 逐题实测 · ask-shapes 换问法</text>
<text x="1086" y="273" class="s">probes:baseline · verify · smoke.sh——全绿才算完</text>
<text x="1086" y="287" class="sm">读 ④ 落下的 *-result.json（模型账两列的出处）</text>
<text x="58" y="296" class="lbl">入口只编排：所有浏览器决策都落到同一个执行循环（④），没有第二个分支</text>
<rect x="40" y="322" width="1480" height="122" class="band"/>
<text x="58" y="346" class="lay">② 应用 = 目录（数据，不是代码）</text>
<rect x="175" y="356" width="320" height="78" class="bxd"/>
<text x="186" y="375" class="t" font-size="12.5">apps/&lt;id&gt;/pack.json</text>
<text x="186" y="391" class="s">roles 模板 · journey 混合步（浏览器+工具）</text>
<text x="186" y="405" class="s">slots · invariants · hosts · device · probe</text>
<text x="186" y="419" class="s">加载期校验：与计划同一套语法</text>
<rect x="510" y="356" width="320" height="78" class="bxd"/>
<text x="521" y="375" class="t" font-size="12.5">sources/*.json（数据腿）</text>
<text x="521" y="391" class="s">transport: curl / fetch / cli（argv 数组，无 shell）</text>
<text x="521" y="405" class="s">extractor 四种 · date 表达式 · counts/selects</text>
<text x="521" y="419" class="s">"引擎不认识站点"是单测</text>
<rect x="845" y="356" width="320" height="78" class="bxd"/>
<text x="856" y="375" class="t" font-size="12.5">flow.json + sites/*.profile.json</text>
<text x="856" y="391" class="s">spec_version 2：页面角色 + 语义目标 + 契约信号</text>
<text x="856" y="405" class="s">authored 档案：pages / fill_keys / list_extract</text>
<text x="856" y="419" class="s">学到的 hint 另存，replays_ok 计数，不过报 drift</text>
<rect x="1180" y="356" width="235" height="78" class="bxd"/>
<text x="1191" y="375" class="t" font-size="12.5">血统与可复现</text>
<text x="1191" y="391" class="s">generated_from / recorded_from</text>
