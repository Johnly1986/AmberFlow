<text x="1191" y="419" class="s">未声明的 {slot} 即用法错误</text>
<text x="58" y="438" class="lbl">新增一个应用 = 新目录；应用目录里的代码行数由 apps:matrix 变成 0 这个数字</text>
<rect x="40" y="460" width="1480" height="92" class="band"/>
<text x="58" y="484" class="lay">③ 计划层</text>
<rect x="175" y="492" width="330" height="50" class="bx"/>
<text x="186" y="511" class="t" font-size="12.5">src/plan.ts — TaskPlan / PlanningRules</text>
<text x="186" y="527" class="s">有序子目标 + 完成信号 + 数据袋 · checkpoint 续跑</text>
<rect x="520" y="492" width="330" height="50" class="bx"/>
<text x="531" y="511" class="t" font-size="12.5">src/planner.ts — runPlan / 重试</text>
<text x="531" y="527" class="s">when 跳过 · retries 整步重跑 · replan 异常必打印</text>
<rect x="865" y="492" width="300" height="50" class="bx"/>
<text x="876" y="511" class="t" font-size="12.5">LLM 规划 / 审计（可选）</text>
