<rect x="1180" y="492" width="235" height="50" class="bx"/>
<text x="1191" y="511" class="t" font-size="12.5">src/signals.ts — 信号语言</text>
<text x="1191" y="527" class="s">5 个 DOM 算子 + all_of/any_of/not</text>
<text x="58" y="548" class="lbl">P4：步 id/next + createPathWalk（路径上界 → next_cycle）；runPlan 拒绝 next 边——声明式后继只在应用旅程层生效；signal 与 when 走同一个走查器</text>
<rect x="40" y="568" width="1480" height="208" class="band"/>
<text x="58" y="592" class="lay">④ 执行层 — 唯一生产循环 BrowserMiddleware.run（永不分叉；bench 只继承换 checkpoint/消融开关）</text>
