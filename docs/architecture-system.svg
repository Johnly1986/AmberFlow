<rect x="40" y="64" width="1170" height="150" class="band"/>
<text x="58" y="86" class="lay">① 入口层 — 一条命令 / 一次工具调用（误输=一行点名，不甩堆栈：cli-args.ts）</text>
<rect x="60" y="96" width="268" height="52" class="bx"/>
<text x="71" y="115" class="t" font-size="12.5">npm start · doctor</text>
<text x="71" y="131" class="s">src/cli/start.ts：开箱任务 / 演示一次归纳</text>
<text x="71" y="145" class="sm">doctor 缺件点名 + 一条补齐命令</text>
<rect x="338" y="96" width="268" height="52" class="bx"/>
<text x="349" y="115" class="t" font-size="12.5">npm run apps · semantic</text>
<text x="349" y="131" class="s">app-runner / semantic-flow</text>
<text x="349" y="145" class="s">整跑一条链 / 模板跨站迁移</text>
<rect x="616" y="96" width="292" height="52" class="bx"/>
<text x="627" y="115" class="t" font-size="12.5">learn · agent · plan:flow</text>
<text x="627" y="131" class="s">tools/learn.ts / src/flow/plan-flow.ts</text>
<text x="627" y="145" class="s">演示一次或一句话 → 包/模板，门槛见 ③</text>
<rect x="918" y="96" width="272" height="52" class="bx"/>
<text x="929" y="115" class="t" font-size="12.5">plan-cli · datasource · bench</text>
<text x="929" y="131" class="s">手写计划；站点=配置；跑分矩阵</text>
<text x="929" y="145" class="sm">探针 live-*：URL 全在 pack 声明</text>
<rect x="60" y="158" width="546" height="44" class="bxp"/>
<text x="71" y="177" class="t" font-size="12.5">DSH 插件（integrations/dsh-bridge）：amberflow_apps / run / learn</text>
<text x="71" y="193" class="s">桥起 CLI 子进程、读 *-result.json 归纳 summary；引擎对 DSH 零引用</text>
<rect x="616" y="158" width="292" height="44" class="bxm"/>
<text x="627" y="177" class="t" font-size="12.5">npm run model:fetch（产物通道）</text>
<text x="627" y="193" class="s">.part 先落 · SHA256 先验后换 · 半途态整组撤回</text>
<rect x="918" y="158" width="272" height="44" class="bxe"/>
<text x="929" y="177" class="t" font-size="12.5">度量与门禁（一条命令可复现）</text>
<text x="929" y="193" class="s">matrix/suite/gen/probes/nominate --check</text>
<text x="929" y="207" class="sm">提名实验台：冻结产物复算不一致即红</text>
<text x="58" y="224" class="lbl">入口只编排：所有浏览器动作都汇入同一个执行循环（⑤），没有第二个分支</text>
<rect x="40" y="236" width="1170" height="118" class="band"/>
<text x="58" y="258" class="lay">② 声明层 — 应用是目录与数据，不是代码（27 个目录，代码行数实测 0）</text>
<rect x="60" y="268" width="380" height="76" class="bxd"/>
<text x="71" y="287" class="t" font-size="12.5">apps/&lt;id&gt;/pack.json（spec_version 1）</text>
<text x="71" y="303" class="s">roles · journey（浏览器步+工具步混排）· slots</text>
<text x="71" y="317" class="s">invariants · hosts · device · probe · policy</text>
<text x="71" y="331" class="sm">加载期校验与计划同一套语法（PlanningRules）</text>
<rect x="450" y="268" width="380" height="76" class="bxd"/>
<text x="461" y="287" class="t" font-size="12.5">flow.json + sites/*.profile.json（v2/v3）</text>
<text x="461" y="303" class="s">2 份模板 / 10 步：页面角色 + 语义目标 + 契约信号</text>
<text x="461" y="317" class="s">v3 声明面：nominate / instr / next / gives</text>
<text x="461" y="331" class="sm">学到的 hint 与指令映射都过重放门；drift 撤下重学</text>
<rect x="840" y="268" width="350" height="76" class="bxd"/>
<text x="851" y="287" class="t" font-size="12.5">transfer/specs/*.json + sources/*.json</text>
<text x="851" y="303" class="s">phase × repeat（once/per_date/per_checkin）</text>
<text x="851" y="317" class="s">数据腿：curl / fetch / cli(argv，无 shell)</text>
<text x="851" y="331" class="sm">「引擎不认识站点」是单测</text>
<text x="58" y="348" class="lbl">落盘与发现（本轮实测修的缝）：pack 与 flow 同一双根纪律——扫 [用户目录, 仓库 apps/]，同 id 用户赢</text>
<rect x="40" y="360" width="1170" height="108" class="band"/>
<text x="58" y="382" class="lay">③ 编译与录制层 — 三类入口，一道门：零模型重放不过 ⇒ 不落盘</text>
<rect x="60" y="392" width="276" height="60" class="bx"/>
<text x="71" y="411" class="t" font-size="12.5">apps:gen（tools/spec-to-pack.ts）</text>
<text x="71" y="427" class="s">spec/代码里的计划 → 整包；FROZEN_TODAY 钉周</text>
<text x="71" y="441" class="sm">--check 进 CI：改 spec 忘重生成就红</text>
<rect x="346" y="392" width="276" height="60" class="bx"/>
<text x="357" y="411" class="t" font-size="12.5">learn（演示一次）</text>
<text x="357" y="427" class="s">动作拾取按稳定句柄；信号/不变量从真转换归纳</text>
<text x="357" y="441" class="sm">不变量取自回放形状，不是演示会话</text>
<rect x="632" y="392" width="276" height="60" class="bx"/>
<text x="643" y="411" class="t" font-size="12.5">plan:flow（一句话+种子页）</text>
<text x="643" y="427" class="s">逐步看页面→真执行→两次独立演示归纳判据</text>
<text x="643" y="441" class="sm">dangerous 由 goal 自动标注；plan 不写 hint</text>
<rect x="918" y="392" width="272" height="60" class="bx"/>
<text x="929" y="411" class="t" font-size="12.5">apps:induce · induce_signals</text>
<text x="929" y="427" class="s">跑通一次 → 候选过判别/稳定句柄/复现三关</text>
<text x="929" y="441" class="sm">选不出来 = manual：如实停，不放宽成"看着像"</text>
<rect x="40" y="478" width="1170" height="96" class="band"/>
<text x="58" y="500" class="lay">④ 计划层 — 冻结的有序子目标</text>
<rect x="60" y="510" width="350" height="52" class="bx"/>
<text x="71" y="529" class="t" font-size="12.5">src/engine/plan.ts：TaskPlan/PlanningRules</text>
<text x="71" y="545" class="s">子目标+完成信号+数据袋；checkpoint 续跑、保留 hint</text>
<rect x="420" y="510" width="330" height="52" class="bx"/>
<text x="431" y="529" class="t" font-size="12.5">src/engine/planner.ts — runPlan / 重试</text>
<text x="431" y="545" class="s">when 跳过 · retries 整步重跑 · replan 异常必打印</text>
<rect x="760" y="510" width="228" height="52" class="bx"/>
<text x="771" y="529" class="t" font-size="12.5">engine/signals.ts — 信号语言</text>
<text x="771" y="545" class="s">5 个 DOM 算子 + all_of/any_of/not</text>
<text x="771" y="559" class="sm">完成与适用同一实现</text>
<rect x="990" y="510" width="200" height="52" class="bx"/>
<text x="1001" y="529" class="t" font-size="12.5">LLM 规划/审计（可选）</text>
<text x="1001" y="545" class="s">OPENAI_* 齐则启用；</text>
<text x="1001" y="559" class="s">否则内置替身，流程照常</text>
<rect x="40" y="584" width="1170" height="268" class="band"/>
<text x="58" y="606" class="lay">⑤ 执行层 — 唯一生产循环 BrowserMiddleware.run（永不分叉）</text>
<rect x="60" y="616" width="214" height="88" class="bx"/>
<text x="71" y="633" class="t" font-size="12">元素池</text>
<text x="71" y="649" class="s">extraction.ts</text>
<text x="71" y="663" class="s">一次 JS pass</text>
<text x="71" y="677" class="s">iframe+shadow</text>
<text x="71" y="691" class="s">非零盒判可见</text>
<rect x="282" y="616" width="214" height="88" class="bx"/>
<text x="293" y="633" class="t" font-size="12">规则先行</text>
<text x="293" y="649" class="s">rules.ts</text>
<text x="293" y="663" class="s">tiered hint 单实现</text>
<text x="293" y="677" class="s">档内歧义才问模型</text>
<text x="293" y="691" class="sm">authored 恒赢已学</text>
<path class="ln" d="M274,660 H282" marker-end="url(#arr)"/>
<rect x="504" y="616" width="214" height="88" class="bxm"/>
<text x="515" y="633" class="t" font-size="12">闭集内选</text>
<text x="515" y="649" class="s">决策层 ⑥ 出场</text>
<text x="515" y="663" class="s">confidence 闸门</text>
<text x="515" y="677" class="s">失手→加宽重看</text>
<text x="515" y="691" class="s">→升级老师（只点名）</text>
<path class="ln" d="M496,660 H504" marker-end="url(#arr)"/>
<rect x="726" y="616" width="214" height="88" class="bx"/>
<text x="737" y="633" class="t" font-size="12">闸门与动作</text>
<text x="737" y="649" class="s">风险=关键词或投票</text>
<text x="737" y="663" class="s">dangerous 先干跑取证</text>
<text x="737" y="677" class="s">hosts 导航信封</text>
<text x="737" y="691" class="s">password/secret 掩码</text>
<path class="ln" d="M718,660 H726" marker-end="url(#arr)"/>
<rect x="948" y="616" width="214" height="88" class="bxe"/>
<text x="959" y="633" class="t" font-size="12">完成判定</text>
<text x="959" y="649" class="s">DOM/URL 信号唯一真值</text>
<text x="959" y="663" class="s">inert → 禁；反复无效 →</text>
<text x="959" y="677" class="s">no_progress（按签名数）</text>
<path class="ln" d="M940,660 H948" marker-end="url(#arr)"/>
<rect x="60" y="714" width="372" height="52" class="bx"/>
<text x="71" y="733" class="t" font-size="12.5">三面同词汇：DOM 面 / 工具面 / 数据面</text>
<text x="71" y="749" class="s">tool-signals：exit/stdout/json_path/file_* 等</text>
<text x="71" y="763" class="sm">retries 需 idempotent；dangerous 先干跑再点头</text>
<rect x="442" y="714" width="372" height="52" class="bxnew"/>
<text x="453" y="733" class="t" font-size="12.5">命令闭集 + 具名绑定（P2/P3 已接线）</text>
<text x="453" y="749" class="s">click|check|fill|select|skip；值只按 slot 具名绑定</text>
<text x="453" y="763" class="sm">list 绑定 = datasource.selectIndex 同一实现</text>
<rect x="824" y="714" width="386" height="52" class="bxe"/>
<text x="835" y="733" class="t" font-size="12.5">运行结果 = 可核对的证据</text>
<text x="835" y="749" class="s">&lt;app&gt;-result.json（model_status、决策账）+ &lt;app&gt;-report.md</text>
<text x="835" y="763" class="sm">suite/matrix/桥 读的是同一份产物</text>
<rect x="60" y="778" width="372" height="56" class="bxnew"/>
<text x="71" y="797" class="t" font-size="12.5">提名梯级 S2 — nominate.ts + 指令注册表</text>
<text x="71" y="813" class="s">②档案 → ①规则 → ③窄问 → ④老师 → ⑤枚举，命中即停</text>
<text x="71" y="827" class="sm">闭集外答案 = 弃权（fail closed）；instr 锁跳过梯级</text>
<rect x="442" y="778" width="372" height="56" class="bxnew"/>
<text x="453" y="797" class="t" font-size="12.5">组合指令解释器 + 数据集生产面（S3）</text>
<text x="453" y="813" class="s">list_pick 声明 compose：extract→select→act，参数全是声明</text>
<text x="453" y="827" class="sm">gives → 信号成立后 dataset.write；重放门前先失效</text>
<rect x="824" y="778" width="386" height="56" class="bxnew"/>
<text x="835" y="797" class="t" font-size="12.5">证据面强制与两本账（S3/S4）</text>
<text x="835" y="813" class="s">提名与 trace 动作族不符 ⇒ instruction_not_honored（blocked）</text>
<text x="835" y="827" class="sm">dataset_view / nominate_bill：生产与账每跑可见</text>
<rect x="40" y="862" width="1170" height="152" class="band"/>
<text x="58" y="884" class="lay">⑥ 决策层 — 可插拔提供者与它的账（实测咨询 5/205 步、独立决定 0）</text>
<rect x="60" y="894" width="470" height="62" class="bxm"/>
<text x="71" y="913" class="t" font-size="12.5">决策提供者注册表（decision-provider.ts）</text>
<text x="71" y="929" class="s">laya-onnx | stub | none | jevk5 | bailian | token-plan | 自注册</text>
<text x="71" y="943" class="sm">基线对照：first-candidate 是新模型要赢的线（providers:baseline）</text>
<rect x="540" y="894" width="306" height="62" class="bxm"/>
<text x="551" y="913" class="t" font-size="12.5">laya-onnx.ts + Router</text>
<text x="551" y="929" class="s">buildSequence · shortlist · 按文字系统选点</text>
<text x="551" y="943" class="sm">置信度从不参与换 checkpoint（ECE 0.855 的教训）</text>
<rect x="856" y="894" width="354" height="62" class="bxm"/>
<text x="867" y="913" class="t" font-size="12.5">decision-cache.ts + countingRuntime</text>
<text x="867" y="929" class="s">精确指纹：同问不重答（二跑 0 forwards 实测）</text>
<text x="867" y="943" class="sm">过关数在 trace 数 · 咨询数在运行时缝数，差值=未过闸</text>
<rect x="60" y="964" width="262" height="42" class="bxm"/>
<text x="71" y="983" class="t" font-size="12.5">学习库：hint 与指令映射</text>
<text x="71" y="999" class="s">过重放门才回填；authored 优先；读-合并-写</text>
<rect x="332" y="964" width="262" height="42" class="bxm"/>
<text x="343" y="983" class="t" font-size="12.5">outcome-memory（opt-in）</text>
<text x="343" y="999" class="s">按元素签名记"点了没变化"，可禁可标注</text>
<rect x="604" y="964" width="320" height="42" class="bxm"/>
<text x="615" y="983" class="t" font-size="12.5">风险头 + 注入守卫（实测阈值，不是默认值）</text>
<text x="615" y="999" class="s">关键词∨模型投票≥0.6 → 要确认；注入 0.95 分离度实测</text>
<rect x="934" y="964" width="290" height="42" class="bxm"/>
<text x="945" y="983" class="t" font-size="12.5">model-artifacts.ts 单一口径</text>
<text x="945" y="999" class="s">三件齐才算 on；缺了如实走规则模式</text>
<rect x="40" y="1024" width="1170" height="108" class="band"/>
<text x="58" y="1046" class="lay">⑦ 验收层 — 结论必须能被命令复现（跳过 ≠ 通过）</text>
<rect x="60" y="1056" width="276" height="60" class="bxe"/>
<text x="71" y="1075" class="t" font-size="12.5">npm run verify</text>
<text x="71" y="1091" class="s">typecheck + 1317 条测试 + 六层对拍</text>
<rect x="346" y="1056" width="276" height="60" class="bxe"/>
<text x="357" y="1075" class="t" font-size="12.5">bench/smoke.sh（CI 的绿色唯一定义）</text>
<text x="357" y="1091" class="s">离线无条件；模型侧缺产物打 SKIP 并跳过</text>
<rect x="632" y="1056" width="284" height="60" class="bxe"/>
<text x="643" y="1075" class="t" font-size="12.5">apps:suite + apps:matrix</text>
<text x="643" y="1091" class="s">分层退出码 0/1/2/3；泄漏 0 · 应用代码 0 行</text>
<rect x="926" y="1056" width="284" height="60" class="bxe"/>
<text x="937" y="1075" class="t" font-size="12.5">metrics 单一出处 + 两图 --check</text>
<text x="937" y="1091" class="s">能算的算出来；快照段标 generated_at 与命令</text>
<rect x="1225" y="64" width="295" height="1068" class="band side"/>
<text x="1243" y="86" class="lay">与世界接壤（系统的边界在哪、缺了什么会怎样）</text>
<rect x="1243" y="96" width="259" height="64" class="bx"/>
<text x="1254" y="115" class="t" font-size="12.5">chromium（Playwright 解析）</text>
<text x="1254" y="131" class="s">PLAYWRIGHT_BROWSERS_PATH 或托管版</text>
<text x="1254" y="145" class="sm">缺 → doctor 直接给那条安装命令</text>
<rect x="1243" y="172" width="259" height="76" class="bx"/>
<text x="1254" y="191" class="t" font-size="12.5">laya 模型产物（1.7GB 级，不进 git）</text>
<text x="1254" y="207" class="s">HF 快照发现 / LAYA_ONNX_MODEL 约定</text>
<text x="1254" y="221" class="sm">缺产物走规则模式；要模型的步骤如实 block</text>
<rect x="1243" y="260" width="259" height="64" class="bx"/>
<text x="1254" y="279" class="t" font-size="12.5">真实站点（线上应用与探针才碰）</text>
<text x="1254" y="295" class="s">携程 H5 走 HTTP 门（浏览器门被拦）</text>
<text x="1254" y="309" class="sm">移动页要声明 device；CI 不依赖网络</text>
<rect x="1243" y="336" width="259" height="52" class="bx"/>
<text x="1254" y="355" class="t" font-size="12.5">DSH 宿主（插件形态才出现）</text>
<text x="1254" y="371" class="s">三个工具走 CLI 子进程；桥不依赖宿主也能测</text>
<rect x="1243" y="400" width="259" height="52" class="bx"/>
<text x="1254" y="419" class="t" font-size="12.5">LLM 端点（可选，OPENAI_*）</text>
<text x="1254" y="435" class="s">规划/审计/升级老师；缺 → 内置替身，流程照常</text>
<rect x="1243" y="464" width="259" height="64" class="bx"/>
<text x="1254" y="483" class="t" font-size="12.5">命令行工具（git/jq/桩）</text>
<text x="1254" y="499" class="s">argv 数组 + env 白名单；永不见 shell</text>
