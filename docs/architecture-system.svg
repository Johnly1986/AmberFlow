<text x="58" y="1166" class="foot" font-weight="700">四条红线（每条都有测试与门禁撑着，不是口号）</text>
<text x="58" y="1186" class="foot">① 不重规划——计划结构冻结在开始；运行期只允许闭集内提名与过门回填；② 不发明取值——填的值只来自数据袋（slots/具名绑定，模型无权产生值）；③ 不信模型说"完成"——只认该步 DOM/URL 信号；④ 不可复现即拒存——零模型重放门不过一个文件都不落，危险步先干跑取证再点头。</text>
<text x="58" y="1206" class="foot">实测口径（单一出处 docs/arch-metrics.json，generated_at 2026-10-18）：浏览器步 173/175 全由声明解决（170 用 hint 点名 = 97.1%，其余 3 步走命令闭集）；真模型臂 19 应用 205 步里咨询 5、独立决定 0——兜底与诊断，不是承重件。</text>
<text x="58" y="1228" class="foot">开箱：`npm ci &amp;&amp; npx playwright install chromium &amp;&amp; npm start` 两条命令见结果；无权重走规则模式（缺件点名+补齐命令）；`npm start -- --goal … --url …` 演示一次即归纳；`plan:flow` 一句话即编译。</text>
