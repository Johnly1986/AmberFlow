<!DOCTYPE html>
<html lang="zh">
<head><meta charset="utf-8"><title>lane fixture — secret input</title>
<style>body { font: 16px/1.3 sans-serif; padding: 12px; } input { display: block; margin: 8px 0; width: 240px; }</style></head>
<body>
<!-- 敏感输入的活值不是身份：password / file / hidden 的 value 绝不可当 label（明文凭据不得进
     池快照 / observe 行 / 模型面 / trace）。非敏感 text 的 value 仍是 label 兜底（既有行为）。
     aria-label / placeholder 是稳定身份，敏感输入也照读。 -->
<input type="password" id="pw" value="hunter2">
<input type="text" id="apikey" value="api-key-placeholder">
<input type="text" id="user" value="alice">
<input type="password" id="pw-labeled" aria-label="密码" value="hunter2">
<input type="password" id="pw-placeholder" placeholder="请输入密码" value="hunter2">
<input type="file" id="file" value="upload.txt">
<input type="hidden" id="csrf" value="hidden-fixture-value">
<div id="region-a">
  <input type="password" id="pw-a" value="hunter2">
  <button id="btn-a" type="button">保存 A</button>
</div>
<div id="region-b">
  <input type="password" id="pw-b" value="hunter2">
  <button id="btn-b" type="button">保存 B</button>
</div>
<button id="go" type="button">登录</button>
</body>
</html>
