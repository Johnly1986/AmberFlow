<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>frames ①：主帧 70 个可交互按钮 + 同源 iframe 对话框（帧预算/跨帧饥饿测量）</title>
<style>
  body { margin: 0; font: 13px/1.2 system-ui, sans-serif; }
  /* 7 列 × 10 行、全部落在首屏内且同尺寸：醒目度（可见交集面积）全等 ⇒ 桶内次序
     退化为 scan（DOM 序），截断位置确定、跨机器可复现。 */
  #grid { display: grid; grid-template-columns: repeat(7, 150px); gap: 8px; padding: 8px; }
  #grid button { height: 36px; }
  #dialog-frame { display: block; margin: 8px; width: 320px; height: 140px; border: 1px solid #999; }
</style>
</head>
<body>
<!-- 70 个可交互按钮：故意超过 act 池预算 64（POOL_CAP_ELEMENTS）。主帧先填满窗口，
     同源 iframe 里的两个按钮就分不到名额（跨帧饥饿的确定性形态）。 -->
<div id="grid">
  <button id="btn-01">Row 01 Btn</button>

<!-- 同源子帧：真站对应 = Google Maps 的对话框 iframe（pool-27.json 的 f1:e0 Cancel /
     f1:e1 Sign In）。同源才能被 extractElements 逐帧 evaluate。 -->
<script>
  /* frames-port 专用：?child=<绝对 origin> 时 iframe 指到该 origin（同 hostname 异端口场景）；
     不传 = 相对 src（同端口）。其余内容与 frames/main-70.html 逐字节一致。 */
  const child = new URLSearchParams(location.search).get("child") || "child-dialog.html";
</script>
<iframe id="dialog-frame" src="child-dialog.html" title="dialog"></iframe>
<script>
  document.getElementById("dialog-frame").src = child;
</script>
