<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>pilot value targets</title>
</head>
<body>
  <!-- 值绑定：两个 fill 目标。goal 先命中 Search term（needs_value）；resume 带 hint 时
       字符串值必须跟着 hint 目标走（落到 Note），而不是只落回旧的值需求键。 -->
  <p><input id="search" type="text" aria-label="Search term"></p>
  <p><input id="note" type="text" aria-label="Note"></p>
</body>
</html>
