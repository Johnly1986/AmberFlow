# Repo-root bundle layer for the ENGINE repository installed as a DSH bundle (`dsh plugin add
# github:Johnly1986/LayaWebUse`, git+file, tarball). This is the git-install door: pnpm clones the
# whole repository, so the plugin entry is addressed as a subpath of the installed package — the
# form the publish guide shows (`dsh-hello-plugin/startup`) — and Node resolution finds the module.
#
# No config and no build script by design: the entry points at the plugin's TypeScript source, which
# the harness loads under its own TS runtime, so `dsh plugin add <git>` needs no allowBuilds grant;
# the bridge locates the checkout it ships inside (or LAYAWEBUSE_REPO / a config override).
# The nested package keeps its own cordis.patch.yml for link/path installs of `integrations/dsh-bridge`.
- insert:
    - id: layawebuse-bridge
      name: layawebuse/dsh-plugin
