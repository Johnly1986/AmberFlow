<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Trekly · stays in Beijing</title>
<link rel="stylesheet" href="style.css">
</head>
<body data-page="hotels">
<header class="tk-top">
  <span class="brand">TREKLY</span>
  <nav><a id="nav-home" href="index.html">Home</a>
       <a id="nav-flights" href="flights.html">Flights</a>
       <a id="nav-hotels" href="hotels.html" class="here">Stays</a></nav>
</header>
<main>
  <h1 id="page-title">Stays · Beijing</h1>
  <section class="panel">
    <div class="row">
      <label for="max-price">Max price per night</label>
      <input type="range" id="max-price" name="cap" min="100" max="1500" step="50" value="1500">
      <label for="sort-by">Sort</label>
      <select id="sort-by" name="sort"></select>
    </div>
    <p class="state"><span id="cap-state">Max price: no limit</span> ·
      <span id="sort-state">Sort: Recommended</span> ·
      <span id="row-count">0 stays</span></p>
  </section>
  <section class="panel">
    <button id="record-shown" type="button" class="primary">Record every stay shown</button>
    <p id="log" class="log"></p>
    <table id="ledger-table">
      <thead><tr><th>#</th><th>Stay</th><th>Stars</th><th>Score</th><th>Area</th><th>Rate</th></tr></thead>
      <tbody></tbody>
    </table>
  </section>
  <section class="panel">
    <table id="stays">
      <thead><tr><th>Stay</th><th>Stars</th><th>Score</th><th>Area</th><th>Room</th><th>Rate</th></tr></thead>
      <tbody></tbody>
    </table>
  </section>
</main>
<script src="data3.js"></script>
<script src="site3.js"></script>
</body>
</html>
