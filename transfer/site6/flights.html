<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>FareHaven · fares</title><link rel="stylesheet" href="style.css"></head>
<body data-page="flights">
<header class="fh-top"><span class="brand">FAREHAVEN</span>
  <nav><a id="nav-home" href="index.html">Home</a>
       <a id="nav-flights" href="flights.html" class="on">Flights</a>
       <a id="nav-hotels" href="hotels.html">Stays</a></nav></header>
<main>
  <h1 id="page-title">Flights · results</h1>
  <section class="card">
    <div class="row">
      <label>Departure window<select id="window" name="window"></select></label>
      <label>Sort<select id="sort" name="sort"></select></label>
    </div>
    <p class="state"><span id="window-state">Departure window: Any time</span> ·
      <span id="sort-state">Sort: Recommended</span> ·
      <span id="row-count">0 fares</span> · <span id="promo-state">Promotion: none today</span></p>
  </section>
  <section class="card">
    <button id="record-cheapest" type="button" class="primary">Record cheapest fare</button>
    <p id="log" class="log"></p>
    <table id="ledger-table">
      <thead><tr><th>Date</th><th>Flight</th><th>Times</th><th>Fare</th></tr></thead><tbody></tbody>
    </table>
  </section>
  <section class="card">
    <table id="fares">
      <thead><tr><th>Departs</th><th>Arrives</th><th>Flight</th><th>Duration</th><th>Fare</th></tr></thead>
      <tbody></tbody>
    </table>
  </section>
</main>
<div id="promo-slot"></div>
<script src="data6.js"></script><script src="site6.js"></script>
</body></html>
