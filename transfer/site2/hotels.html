<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>SkyBook · hotels in Beijing</title>
<link rel="stylesheet" href="style.css">
</head>
<body data-page="hotels">
<header class="sb-top">
  <span class="brand">SkyBook</span>
  <nav><a id="nav-home" href="index.html">Home</a>
       <a id="nav-flights" href="flights.html">Flights</a>
       <a id="nav-hotels" href="hotels.html" class="active">Hotels</a></nav>
</header>
<main>
  <h1 id="page-title">Hotels · Beijing</h1>

  <section class="panel">
    <fieldset>
      <legend>Price per night</legend>
      <label><input type="radio" name="cap" id="cap-all" value="all"> Any price</label>
      <label><input type="radio" name="cap" id="cap-200" value="200"> ¥200 or less</label>
      <label><input type="radio" name="cap" id="cap-300" value="300"> ¥300 or less</label>
      <label><input type="radio" name="cap" id="cap-500" value="500"> ¥500 or less</label>
    </fieldset>
    <div class="row">
      <label for="sort">Sort by</label>
      <select id="sort" name="sort"></select>
    </div>
    <p class="state"><span id="cap-state">Price cap: Any price</span> ·
      <span id="sort-state">Sort: Recommended</span> ·
      <span id="result-count">0 hotels</span> ·
      <span id="page-state">Page 1 of 1</span></p>
  </section>

  <section class="panel">
    <label><input type="checkbox" id="select-all" class="pick"> Select all shown</label>
    <span id="selection-count" class="selection">Click a hotel to select</span>
    <button id="record-selected" type="button" class="primary">Record selected</button>
    <p id="hotel-recorded" class="ledger"></p>
    <table id="record-table">
      <thead><tr><th>#</th><th>Hotel</th><th>Stars</th><th>Score</th><th>Area</th><th>Price</th></tr></thead>
      <tbody></tbody>
    </table>
  </section>

  <section id="results" class="grid"></section>
  <nav class="pager"><a id="next-page" rel="next" href="#">Next page →</a></nav>
</main>
<script src="data2.js"></script>
<script src="site2.js"></script>
</body>
</html>
