<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>SkyBook · flights Kunming to Beijing</title>
<link rel="stylesheet" href="style.css">
</head>
<body data-page="flights">
<header class="sb-top">
  <span class="brand">SkyBook</span>
  <nav><a id="nav-home" href="index.html">Home</a>
       <a id="nav-flights" href="flights.html" class="active">Flights</a>
       <a id="nav-hotels" href="hotels.html">Hotels</a></nav>
</header>
<main>
  <h1 id="page-title">Flights · One way</h1>

  <section class="panel">
    <div class="row">
      <label for="window">Departure window</label>
      <select id="window" name="window"></select>
      <label for="sort">Sort by</label>
      <select id="sort" name="sort"></select>
    </div>
    <p class="state"><span id="window-state">Departure window: Any time</span> ·
      <span id="sort-state">Sort: Recommended</span> ·
      <span id="result-count">0 flights</span></p>
  </section>

  <section class="panel">
    <button id="record-lowest" type="button" class="primary">Record lowest fare</button>
    <p id="last-record" class="ledger"></p>
    <table id="record-table">
      <thead><tr><th>Date</th><th>Flight</th><th>Times</th><th>Fare</th><th>Window</th></tr></thead>
      <tbody></tbody>
    </table>
  </section>

  <section id="results" class="grid"></section>
</main>
<script src="data2.js"></script>
<script src="site2.js"></script>
</body>
</html>
