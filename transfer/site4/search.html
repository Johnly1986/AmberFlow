<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>FlyQuest · find flights</title>
<link rel="stylesheet" href="style.css">
</head>
<body data-page="search">
<header class="fq-top">
  <span class="brand">FLYQUEST</span>
  <nav><a id="nav-home" href="index.html">Home</a>
       <a id="nav-flights" href="search.html" class="on">Flights</a>
       <a id="nav-hotels" href="stays.html">Stays</a></nav>
</header>
<main>
  <h1 id="page-title">Flights · search</h1>
  <section class="card">
    <form class="row" id="search-form">
      <label>From<input id="from" name="from" value="KMG" readonly></label>
      <label>To<input id="to" name="to" value="BJS" readonly></label>
      <label>Departure date<input id="date" name="date" type="date" value=""></label>
      <label>Departure window<select id="window" name="window"></select></label>
      <button type="submit" id="search-btn" class="primary">Search flights</button>
    </form>
    <p class="state" id="search-state">Fill the date and press Search.</p>
  </section>
</main>
<script src="data4.js"></script>
<script src="site4.js"></script>
</body>
</html>
