<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>FlyQuest · fares</title>
<link rel="stylesheet" href="style.css">
</head>
<body data-page="fares">
<header class="fq-top">
  <span class="brand">FLYQUEST</span>
  <nav><a id="nav-home" href="index.html">Home</a>
       <a id="nav-flights" href="search.html" class="on">Flights</a>
       <a id="nav-hotels" href="stays.html">Stays</a></nav>
</header>
<main>
  <h1 id="page-title">Flights · results</h1>
  <section class="card">
    <div class="row">
      <label>Sort<select id="sort" name="sort"></select></label>
    </div>
    <p class="state"><span id="window-state">Departure window: Any time</span> ·
      <span id="sort-state">Sort: Recommended</span> ·
      <span id="row-count">0 fares</span></p>
  </section>
  <section class="card">
    <button id="record-cheapest" type="button" class="primary">Record cheapest fare</button>
    <p id="log" class="log"></p>
    <table id="ledger-table">
      <thead><tr><th>Date</th><th>Flight</th><th>Times</th><th>Fare</th></tr></thead>
      <tbody></tbody>
    </table>
  </section>
  <section class="card">
    <table id="fares">
      <thead><tr><th>Departs</th><th>Arrives</th><th>Flight</th><th>Duration</th><th>Fare</th></tr></thead>
      <tbody></tbody>
    </table>
  </section>
</main>
<script src="data4.js"></script>
<script src="site4.js"></script>
</body>
</html>
