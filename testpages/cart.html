<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><title>Your Cart (2 items) - Example Shop</title>
<style>body{font-family:sans-serif;max-width:640px;margin:40px auto}header a{font-weight:bold;text-decoration:none;color:#111}.badge{background:#c00;color:#fff;border-radius:10px;padding:1px 8px;margin-left:4px}button,a.btn,select,input{padding:6px 10px;margin:6px 4px}</style>
</head>
<body>
<header><a data-test="logo" href="product.html">Example Shop</a>
  <a data-test="cart-link" href="cart.html">Cart<span class="badge" data-test="cart-count">2</span></a></header>
<main>
  <h1>Your Cart</h1>
  <ul><li>Wireless Mouse X200 x1 &mdash; $29.99</li><li>USB-C Cable x1 &mdash; $9.99</li></ul>
  <p>Subtotal: $39.98</p>
  <a class="btn" data-test="checkout" href="checkout.html">Proceed to checkout</a>
  <input data-test="coupon" placeholder="Coupon code">
  <select data-test="qty"><option>1</option><option>2</option><option>3</option></select>
  <a href="product.html">Continue shopping</a>
</main>
</body>
</html>
