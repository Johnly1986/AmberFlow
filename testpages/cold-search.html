<!DOCTYPE html>
<html lang="zh">
<head><meta charset="utf-8"><title>冷启动搜索 - 示例站</title>
<style>body{font-family:sans-serif;max-width:640px;margin:40px auto}input,button{padding:6px 10px;margin:6px 4px}</style>
</head>
<body>
<main>
  <h1>结果检索</h1>
  <!-- P4 的夹具：站点状态活在**会话**里，而不是 URL 或页面 JS 变量里。
       第一次搜索命中冷缓存（0 条结果），第二次才有结果——每个子目标都会重新 goto，
       所以"再搜一次"必须由声明的后继边表达，页面自己不能用内存变量记住它。 -->
  <label>关键词 <input data-test="q"></label>
  <button data-test="search">搜索</button>
  <p data-test="status">未搜索</p>
  <ul data-test="results"></ul>
  <button data-test="record">记录结果</button>
  <p data-test="recorded">未记录</p>
</main>
<script>
const searches = () => Number(sessionStorage.getItem('amber-searches') || '0');
function render() {
  if (searches() >= 2) {
    document.querySelector('[data-test=results]').innerHTML = '<li>结果 A</li><li>结果 B</li>';
    document.querySelector('[data-test=status]').textContent = '搜索完成：2 条结果';
  }
}
document.querySelector('[data-test=search]').addEventListener('click', () => {
  const q = document.querySelector('[data-test=q]').value.trim();
  const st = document.querySelector('[data-test=status]');
  if (!q) { st.textContent = '请输入关键词'; return; }
  const n = searches() + 1;
  sessionStorage.setItem('amber-searches', String(n));
  if (n === 1) {
    st.textContent = '搜索完成：0 条结果（首次命中，缓存冷）';
    document.querySelector('[data-test=results]').innerHTML = '';
    return;                                     // 这一次搜索"成功"了，只是结果还没到位
  }
  render();
});
document.querySelector('[data-test=record]').addEventListener('click', () => {
  const n = document.querySelectorAll('[data-test=results] li').length;
  document.querySelector('[data-test=recorded]').textContent =
    n ? '已记录 ' + n + ' 条' : '没有可记录的结果';
});
render();                                       // 暖了之后重新进入本页就带着结果
</script>
</body>
</html>
