<!DOCTYPE html>
<html lang="zh">
<head><meta charset="utf-8"><title>录入成功 - Example Shop</title>
<style>body{font-family:sans-serif;max-width:560px;margin:40px auto}
header a{font-weight:bold;text-decoration:none;color:#111}</style>
</head>
<body>
<header><a data-test="logo" href="portal.html">设备管理系统</a></header>
<main>
  <h1 data-test="ok-title">录入成功</h1>
  <p>设备 <span data-test="ok-serial"></span> 已保存(表单 <span data-test="ok-form"></span>)。</p>
  <a href="portal.html">继续录入</a>
</main>
<script>
  const q = new URLSearchParams(location.search);
  document.querySelector("[data-test='ok-serial']").textContent = q.get("serial") || "-";
  document.querySelector("[data-test='ok-form']").textContent = q.get("form") || "-";
</script>
</body>
</html>
