<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Overlay SPA test</title>
<style>body{font-family:sans-serif;margin:20px}
#cookie{position:fixed;top:0;left:0;width:100%;height:480px;background:#333;color:#fff;
  display:flex;align-items:center;justify-content:space-between;padding:0 20px;box-sizing:border-box;z-index:99}
button{padding:8px 16px}</style></head>
<body>
<div id="cookie"><span>We use cookies.</span><button data-test="accept">Accept</button></div>
<main>
  <h1>Order page</h1>
  <p>Your total is $42.00.</p>
  <button data-test="pay-now" style="margin-top:340px">Pay now</button>
  <p data-test="order-state">not ordered</p>
</main>
<script>
document.querySelector("[data-test='accept']").addEventListener("click", () => {
  document.getElementById("cookie").remove();
});
document.querySelector("[data-test='pay-now']").addEventListener("click", () => {
  document.querySelector("[data-test='order-state']").textContent = "ORDERED";
});
</script>
</body></html>
