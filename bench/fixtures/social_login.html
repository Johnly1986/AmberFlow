<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><title>DevBook - Sign in</title>
<style>body{font-family:sans-serif;max-width:420px;margin:60px auto}
input{display:block;width:100%;padding:8px;margin:8px 0;box-sizing:border-box}
button{padding:8px 20px;margin-top:10px}.err{color:#c00;min-height:18px}</style>
</head>
<body>
<main>
  <h1>Sign in to DevBook</h1>
  <form onsubmit="return login(event)">
    <input data-test="user" placeholder="Username" required>
    <input data-test="pass" type="password" placeholder="Password" required>
    <p class="err" data-test="login-error"></p>
    <button type="submit" data-test="login-btn">Sign in</button>
    <a href="#" data-test="forgot">Forgot password?</a>
  </form>
</main>
<script>
function login(e){
  e.preventDefault();
  const u = document.querySelector("[data-test='user']").value.trim();
  const p = document.querySelector("[data-test='pass']").value;
  const err = document.querySelector("[data-test='login-error']");
  if (u === "demo" && p === "demo1234") { location.href = "social_feed.html"; }
  else { err.textContent = "Invalid username or password"; }
  return false;
}
</script>
</body>
</html>
