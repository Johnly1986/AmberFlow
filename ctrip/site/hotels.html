<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>北京酒店,北京酒店预订查询,北京宾馆住宿【携程酒店】</title>
<link rel="stylesheet" href="ctrip.css">
</head>
<body data-page="hotels">
<header class="ct-header">
  <span class="logo">携程旅行</span>
  <nav><a href="ct_home.html">首页</a><a href="flights.html">机票</a><a href="hotels.html" class="on">酒店</a></nav>
</header>
<main>
  <h1 data-test="page-title">酒店 · 北京</h1>

  <div class="card">
    <div class="search-bar">
      <label>目的地<input id="city-input" value="北京" readonly></label>
      <label>入住日期<input id="checkin-input" value="" readonly></label>
      <button data-test="search">搜索</button>
    </div>
    <div class="meta" data-test="city" id="city" style="margin-top:8px">北京</div>
    <div class="meta" data-test="checkin" id="checkin">入住：</div>
  </div>

  <div class="card">
    <div class="filters" id="filters-cap" data-test="filters-cap"></div>
    <div class="filters" id="filters-sort" data-test="filters-sort" style="margin-top:8px"></div>
    <div class="state-line">
      <span data-test="price-cap-state" id="cap-state">价格上限：不限</span>
      <span data-test="sort-state" id="sort-state">排序：默认排序</span>
      <span data-test="result-count" id="result-count">共 0 家酒店</span>
    </div>
  </div>

  <div class="card">
    <button class="primary" data-test="record-hotels">记录当前列表全部酒店</button>
    <div class="record-box" data-test="hotel-recorded" id="hotel-recorded"></div>
    <table class="records" data-test="hotel-record-table" id="hotel-record-table">
      <thead><tr><th>#</th><th>酒店</th><th>星级</th><th>评分</th><th>位置</th><th>价格</th></tr></thead>
      <tbody></tbody>
    </table>
  </div>

  <ul class="hotel-list" id="hotel-list" data-test="hotel-list"></ul>
</main>
<script src="ctrip_data.js"></script>
<script src="site.js"></script>
</body>
</html>
